<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <table border="2px" cellpadding="5px">
        <caption>Estoque de itens</caption>
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Valor</th>
        </tr>
        <tr>
            <td>Computador</td>
            <td>5</td>
            <td>R$ 5000.00</td>
        </tr>
        <tr>
            <td>Notebook</td>
            <td>3</td>
            <td>R$ 3000.00</td>
        </tr>
        <tr>
            <td colspan="2">Valor total</td>
            <td>R$ 40000.00</td>
        </tr>
        <tr>
            <td>Item 1</td>
            <td>Item 2</td>
            <td rowspan="2">Item 3</td>
        </tr>
        <tr>
            <td>Item 1</td>
            <td>Item 2</td>
        </tr>
    </table>
</body>
</html>
