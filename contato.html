<!DOCTYPE html>
<html lang="PTBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: rgb(36, 48, 114); color: aliceblue; text-align: center;">
    <h1>Entrar em contato</h1>
    <hr>
    <br>
    <br>
    <h2>Entre em contato conosco preenchendo o formulário abaixo:</h2>
    <br>
    <br>
    <form>
        <label for="nome">nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Escreva seu nome"required>
        <br>
        <br>
        <label for="email">email</label>
        <input type="email" id="email" name="email" placeholder="nome@email.com"required>
        <br>
        <br>
        <label for="">assunto:</label>
        <input type="text" id="assunto" name="assunto" placeholder="digite um assunto"required>
        <br>
        <br>
        <label for="">telefone</label>
        <input type="tel" id="telefone" name="telefone" maxlength="15" placeholder="(11) 99999-9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-{4}" title="Digite no formato (11) 99999-9999">
        <br>
        <br>
        <p>Forma de contato preferida</p>
        <input type="radio" id="sms" name="contato" value="sms">
        <label for="sms">SMS</label>
         <input type="radio" id="email" name="contato" value="email">
        <label for="email">Email</label>
         <input type="radio" id="whatsapp" name="contato" value="whatsapp">
        <label for="whatsapp">WhatsApp</label>
        <br>
        <br>
        <hr>
        <h3>Lista de interesse:</h3>
        <input type="checkbox" id="Tênis esportivos" name="Tênis esportivos" value="Tênis esportivos">
        <label for="Tênis esportivos">Tênis esportivos</label>
        <br>
        <input type="checkbox" id="Acessórios esportivos" name="Acessórios esportivos" value="Acessórios esportivos">
        <label for="Acessórios esportivos">Acessórios esportivos</label>
        <br>
        <input type="checkbox" id="Roupas esportivas" name="Roupas esportivas" value="Roupas esportivas">
        <label for="Roupas esportivas">Roupas esportivas</label>
        <br>
        <input type="checkbox" id="Lançamentos da Nike" name="Lançamentos da Nike" value="Lançamentos da Nike">
        <label for="Lançamentos da Nike">Lançamentos da Nike</label>
        <br>
        <input type="checkbox" id="Camisetas e regatas" name="Camisetas e regatas" value="Camisetas e regatas">
        <label for="Camisetas e regatas">Camisetas e regatas</label>
        <br>
        <input type="checkbox" id="Shorts e calças" name="Shorts e calças" value="Shorts e calças">
        <label for="Shorts e calças">Shorts e calças</label>
        <br>
        <input type="checkbox" id="Promoções e descontos" name="Promoções e descontos" value="Promoções e descontos">
        <label for="Promoções e descontos">Promoções e descontos</label>
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Resetar</button>
        <br>
        <br>
        <br>
        <a href="index.html" style="color: rgb(219, 222, 224); font-size: larger;">Retornar a página principal.</a>

    
</body>
</html>
